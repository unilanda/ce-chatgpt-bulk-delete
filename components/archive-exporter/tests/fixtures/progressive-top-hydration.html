<main>
  <section data-chatgpt-conversation-selection-target>
    <div data-app-action-timeline-scroll
         style="height:120px;width:500px;overflow-y:auto">
      <div data-turn-key="middle-2" style="min-height:100px">
        <div data-user-message-bubble>Middle prompt</div>
        <div data-conversation-role="assistant">ChatGPT said:</div>
        <div class="markdown">Middle answer</div>
      </div>
      <div data-turn-key="newest-3" style="min-height:100px">
        <div data-user-message-bubble>Newest prompt</div>
        <div data-conversation-role="assistant">ChatGPT said:</div>
        <div class="markdown">Newest answer</div>
      </div>
      <div role="status">Loading older history</div>
    </div>
  </section>
</main>
